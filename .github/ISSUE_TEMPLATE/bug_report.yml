name: 🐞 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the issue you encountered.
      placeholder: When I do X in Mwrite I expected Y to happen, but Z happened instead...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide exact steps to reproduce the issue.
      placeholder: |
        1. Deploy Mwrite with docker compose up
        2. Navigate to ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you expected Mwrite to do.
      placeholder: The page should have loaded without errors.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what actually happened instead.
      placeholder: "It returned a 500 error: ..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mwrite Version
      description: Which version of Mwrite are you running? (Check pyproject.toml or the git tag)
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: The Python version you are using.
      placeholder: "e.g., 3.11"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: The OS you are running Mwrite on.
      placeholder: "e.g., Ubuntu 22.04, macOS 15"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm before submitting
      options:
        - label: I have checked for existing issues
          required: true
        - label: I have provided a clear description and steps to reproduce
          required: true
