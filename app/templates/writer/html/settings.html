<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — {{ settings.blog_name }}</title>
  <link rel="stylesheet" href="/static/writer/css/index.css" />
  <link rel="stylesheet" href="/static/writer/css/settings.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="brand"><h1>{{ settings.blog_name }}</h1><p>Admin</p></div>
    <nav>
      <a href="/writer" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
      {% if "super_admin" in writer.roles %}
      <a href="/writer/settings" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </a>
      <a href="/writer/admins" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Admins
      </a>
      {% endif %}
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="page-header">
      <div><h2>Settings</h2><p class="subtitle">Blog configuration</p></div>
    </header>

    <div id="toast" class="toast hidden"></div>

    <form class="settings-form" id="identityForm">
      <div class="form-section">
        <h3 class="section-title">Blog Identity</h3>
        <div class="form-group">
          <label for="blog_name">Blog Name</label>
          <input type="text" id="blog_name" name="blog_name" maxlength="200" />
        </div>
        <div class="form-group">
          <label for="blog_description">Description</label>
          <textarea id="blog_description" name="blog_description" maxlength="500" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="blog_author">Author Name</label>
          <input type="text" id="blog_author" name="blog_author" maxlength="200" />
        </div>
        <div class="form-group">
          <label for="blog_tagline">Tagline</label>
          <input type="text" id="blog_tagline" name="blog_tagline" maxlength="200" />
        </div>
        <div class="form-group">
          <label for="og_image">Default Social Image</label>
          <input type="file" id="og_image" accept="image/*" />
          <p class="field-hint" id="og_image_hint"></p>
        </div>
        <button type="submit" class="btn-primary">Save Identity</button>
      </div>
    </form>

    <form class="settings-form" id="readerForm">
      <div class="form-section">
        <h3 class="section-title">Reader Experience</h3>
        <div class="form-group">
          <label for="footer_text">Footer Text</label>
          <textarea id="footer_text" name="footer_text" maxlength="500" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="posts_per_page">Posts Per Page</label>
          <input type="number" id="posts_per_page" name="posts_per_page" min="1" max="100" />
        </div>
        <div class="form-group form-group--inline">
          <label for="allow_indexing">Allow Search Engine Indexing</label>
          <input type="checkbox" id="allow_indexing" name="allow_indexing" />
        </div>
        <button type="submit" class="btn-primary">Save Reader Settings</button>
      </div>
    </form>
  </main>

  <script src="/static/writer/js/settings.js"></script>
</body>
</html>
