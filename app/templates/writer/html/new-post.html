<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mwrite — New Post</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" />
  <link rel="stylesheet" href="/static/writer/css/index.css" />
  <link rel="stylesheet" href="/static/writer/css/new-post.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <h1>Mwrite</h1>
      <p>Admin</p>
    </div>

    <nav>
      <a href="/writer" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="main editor-main">
    <header class="editor-header">
      <a href="/writer" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Posts
      </a>
      <div class="editor-actions">
        <span class="save-status" id="saveStatus"></span>
        <button class="btn-ghost" id="draftBtn">Save Draft</button>
        <button class="btn-primary" id="publishBtn">Publish</button>
      </div>
    </header>

    <div class="editor-body">
      <input
        type="text"
        id="titleInput"
        class="title-input"
        placeholder="Post title…"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="editor"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
  <script src="/static/writer/js/new-post.js"></script>
</body>
</html>
