<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mwrite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/static/shared/css/base.css" />
  <link rel="stylesheet" href="/static/reader/css/index.css" />
</head>
<body>

  <header class="site-header">
    <div class="inner">
      <a href="/"><h1>Mwrite</h1></a>
    </div>
  </header>

  <main class="content">
    <div id="postList" class="post-list"></div>
    <p id="emptyState" class="empty" style="display:none">No posts yet.</p>

    <div class="pagination" id="pagination" style="display:none">
      <button class="btn-page" id="prevBtn">← Previous</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="btn-page" id="nextBtn">Next →</button>
    </div>
  </main>

  <script src="/static/reader/js/index.js"></script>
</body>
</html>
