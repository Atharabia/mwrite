<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if blog %}{{ blog.title }} — Mwrite{% else %}Not Found — Mwrite{% endif %}</title>
  <link rel="stylesheet" href="/static/reader/css/post.css" />
</head>
<body>

  <header class="site-header">
    <div class="inner">
      <a href="/"><h1>Mwrite</h1></a>
    </div>
  </header>

  {% if blog %}
    <article class="post-wrapper">
      <header class="post-header">
        <h1 class="post-title">{{ blog.title }}</h1>
        <div class="post-meta">
          <span>{{ blog.created_at.strftime('%b %-d, %Y') }}</span>
        </div>
      </header>

      <div class="post-content">
        {{ blog.content | safe }}
      </div>
    </article>
  {% else %}
    <div class="post-wrapper">
      <p class="not-found">Post not found.</p>
    </div>
  {% endif %}

</body>
</html>
